<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contacto — Empresa Ficticia</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container py-5" style="max-width: 560px;">

        <h1 class="mb-1">Dejanos tu consulta</h1>

        <p class="text-muted mb-4">
            Te respondemos a la brevedad por email o WhatsApp.
        </p>

        <form id="formulario" class="card p-4 shadow-sm">

            <!-- Nombre y apellido -->
            <div class="mb-3">

                <label for="nombre" class="form-label">
                    Nombre y apellido
                </label>

                <input
                    id="nombre"
                    class="form-control"
                    required>

            </div>

            <!-- Email -->
            <div class="mb-3">

                <label for="email" class="form-label">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    class="form-control"
                    required>

            </div>

            <!-- Teléfono -->
            <div class="mb-3">

                <label for="telefono" class="form-label">
                    Teléfono
                </label>

                <input
                    id="telefono"
                    class="form-control"
                    required>

            </div>

            <!-- Mensaje -->
            <div class="mb-3">

                <label for="mensaje" class="form-label">
                    Mensaje
                </label>

                <textarea
                    id="mensaje"
                    class="form-control"
                    rows="3"
                    required></textarea>

            </div>

            <!-- Botón -->
            <button
                type="submit"
                id="boton"
                class="btn btn-primary w-100">

                Enviar consulta

            </button>

            <!-- Estado -->
            <p
                id="estado"
                class="text-center mt-3 mb-0">
            </p>

        </form>

    </main>


    <script>

        // IMPORTANTE:
        // Reemplazar esta dirección por la URL de tu Web App de Google Apps Script.
        // La URL debe terminar en /exec.

        var URL_BACKEND = "https://script.google.com/macros/s/AKfycbz4u_rfQX2PsrCaBnUdTcKYgc5uDNi9szcAY-kPRaP56AYsLGVZfMZyAaaFV8Mm1rPi/exec"; 


        document
            .getElementById("formulario")
            .addEventListener("submit", function (evento) {

                evento.preventDefault();


                // Obtener los datos del formulario
                var datos = {

                    nombre:
                        document.getElementById("nombre").value,

                    email:
                        document.getElementById("email").value,

                    telefono:
                        document.getElementById("telefono").value,

                    mensaje:
                        document.getElementById("mensaje").value

                };


                // Obtener botón y mensaje de estado
                var boton =
                    document.getElementById("boton");

                var estado =
                    document.getElementById("estado");


                // Desactivar botón mientras se envía
                boton.disabled = true;

                boton.textContent = "Enviando...";


                // Enviar datos al backend
                fetch(URL_BACKEND, {

                    method: "POST",

                    // Envía los datos al backend como JSON
                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(datos)

                })


                // Recibir respuesta del backend
                .then(function (respuesta) {

                    return respuesta.json();

                })


                // Si todo salió correctamente
                .then(function (resultado) {

                    estado.textContent =
                        "¡Gracias! Tu consulta fue registrada.";

                    estado.className =
                        "text-center mt-3 mb-0 text-success";


                    // Limpiar formulario
                    document
                        .getElementById("formulario")
                        .reset();

                })


                // Si ocurrió un error
                .catch(function (error) {

                    estado.textContent =
                        "Hubo un error. Intentá de nuevo.";

                    estado.className =
                        "text-center mt-3 mb-0 text-danger";

                })


                // Volver a habilitar el botón
                .finally(function () {

                    boton.disabled = false;

                    boton.textContent =
                        "Enviar consulta";

                });

            });

    </script>

</body>

</html>
